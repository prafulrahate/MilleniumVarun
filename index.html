<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unicode → Millennium Varun Converter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" href="FontConverter/MilleniumVarun Normal.ttf" as="font" type="font/ttf" crossorigin="anonymous">
   <style>
    @font-face {
      font-family: 'MilleniumVarun';
      src: url('MilleniumVarun Normal.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    </style>
</head>
<body>
  <div class="container">
    <h1>Unicode → Millennium Varun Converter</h1>
    <div class="upload-section">
    <label class="upload-label" style="font-family: 'MilleniumVarun'">
      Font Loaded: MilleniumVarun Normal
    </label>
  </div>
    <div class="glyph-preview" id="glyphPreview"></div>
    <div class="input-section">
      <textarea id="unicodeInput" placeholder="Paste Hindi Unicode text here..."></textarea>
    </div>
    <button class="convert-btn" id="convertBtn">Convert</button>
    <div class="output-section">
      <div class="output-box" id="outputBox"></div>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
