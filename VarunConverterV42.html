            // Millennium Varun High-ASCII Mapping (v42.0 - Stable)
            const mapping = {
                'अ': 'Dç', 'आ': 'Dçç', 'इ': 'F', 'ई': 'F&', 'उ': 'G', 'ऊ': 'G',

                'च': '®ç', 'छ': 's', 'ज': 'pç', 'झ': 'Pç', 'ञ': '¥',
                'ट': 'ì', 'ठ': '"', 'ड': '[', 'ढ': '{', 'ण': 'Cç',
                'त': 'lç', 'थ': 'Lç', 'द': 'o', 'ध': 'Oç', 'न': 'vç',
                'प': 'Hç', 'फ': 'HçÀ', 'ब': 'yç', 'भ': 'Yç', 'म': 'cç',
                'य': '³ç', 'र': 'j', 'ल': '}', 'व': 'Jç', 'श': 'µç', 'ष': '<ç', 'स': 'mç', 'ह': 'n',
                'क्ष': '#ç', 'त्र': '$ç', 'ज्ञ': 'pç¥', 
                'ा': 'ç', 'ि': 'çÆ', 'ी': 'çÇ', 'ु': 'á', 'ू': 'Ó', 'े': 'í', 'ै': 'Ì', 'ो': 'çí', 'ौ': 'çÌ',

                '०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9',
                '।': '~', '॥': '..', '(': '(', ')': ')', '"': '’', "'": "'", ':': ':', ',': ',', ' ': ' ', 
                '-': '-', '—': 'õ', '–': 'ö', '‘': '`', '’': "'", '“': '’', '”': '’',
                'ळ': 'U' // Added Marathi Lla
            };

            const convertToMillennium = (unicodeText) => {
                if (!unicodeText) return '';
                
                // Pre-cleaning
                let text = unicodeText
                    .replace(/[\u200B-\u200D\uFEFF]/g, '')
                    .replace(/"/g, "’");

                // Priority Overrides
                const exactMatches = {
                    'वैश्य': 'JçÌµ³ç', 'ज्ञाती': '%ççlççÇ', 'मंडळ': 'cçb[U', 'मुलुंड': 'cçá}áb[',

                    'अभिव्यक्ति': 'DççÆYçJ³ççqJçwlç', 'उद्भव': 'GtJç', 'इब्रानी': 'Fyç´çvççÇ', 'सुमेरु': 'mçácçí©',
                    'बलग्गु': 'yç}iiçá', 'बलगु': 'yç}içá', 'उल्लेख': 'Gu}íKç', 'विद्वान्': 'çÆJçÜçvçd',
                    'विद्वान': 'çÆJçÜçvç', 'कुछ': 'JçáÀs', 'सम्पूर्ण': 'mçcHçÓCç&', 'वाङ्मय': 'Jçç*dcç³ç',
                    'छन्दोबद्ध': 'svoçíyç×', 'प्रायः': 'Òçç³ç:', 'करें': 'JçÀjW', 'रुदन': '©ovç', 
                    'सर्वश्रेष्ठ': 'mçJç&Þçí÷', 'द्वारा': 'Üçjç', 'सुन्दर': 'mçávoj', 'समृद्ध': 'mçcç=×',
                    'सुसम्पन्न': 'mçámçcHçVç', 'महत्वपूर्ण': 'cçnlJçHçÓCç&', 'मनुष्य': 'cçvçá<³ç', 'हृदय': 'Ëo³ç',

                    'प्रक्रिया': 'ÒççÆ¬çÀ³çç', 'संस्कृतियों': 'mçbmJç=ÀçÆlç³ççíb', 'अभिन्न': 'DççÆYçVç', 'कलात्मक': 'JçÀ}çlcçJçÀ',
                    'व्यवस्थित': 'J³çJççqmLçlç', 'जिसमें': 'çÆpçmçcçW', 'शामिल': 'µçççÆcç}', 'टेक्सचर': 'ìíJçwmç®çj',
                    'वॉल्यूम': 'Jçç@u³çÓcç', 'सौंदर्य': 'mççÌbo³ç&', 'उत्पन्न': 'GlHçVç', 'व्यक्त': 'J³çJçwlç',
                    'गतिशीलता': 'iççÆlçµççÇ}lçç', 'सिर्फ': 'çÆmçHç&À', 'नहीं': 'vçnçR', 'बल्कि': 'yççquJçÀ',

                    'यंत्र': '³çb$ç', 'बजाने': 'yçpççvçí', 'और': 'DççÌj', 'हमें': 'ncçW',
                    'गाना': 'iççvçç', 'एक': 'SJçÀ', 'का': 'JçÀç', 'की': 'JçÀçÇ',
                    'के': 'JçíÀ', 'को': 'JçÀçí', 'है': 'nÌ', 'हैं': 'nQ',
                    'में': 'cçW', 'मैं': 'cçQ', 'से': 'mçí', 'लिए': 'çÆ}S',
                    'इसे': 'Fmçí', 'जहाँ': 'pçnçB', 'रूप': 'ªHç', 'संगम': 'mçbiçcç',
                    'देखा': 'oíKçç', 'जाता': 'pççlçç', 'ये': '³çí', 'तीनों': 'lççÇvççíb',
                    'कलाएँ': 'JçÀ}çSB', 'साथ': 'mççLç', 'कहलाती': 'JçÀn}çlççÇ',
                    'विशिष्ट': 'çÆJççÆµçä', 'प्रस्फुटन': 'ÒçmHçáÀìvç', 'कंठ्य': 'JçbÀ"îç', 'सुरीले': 'mçájçÇ}í',
                    'ढोलक': '{çí}JçÀ', 'औऱ': 'DççÌ]j', 'शृंगी': 'µç=biççÇ', 'ड्रम': '[^cç',
                    'सभ्यता': 'mçY³çlçç', 'ख़ास': '™ççmç', 'सम्वेदनाओं': 'mçcJçíovççDççíb'
                };

                Object.keys(exactMatches).sort((a, b) => b.length - a.length).forEach(word => {
                    text = text.replace(new RegExp(word, 'g'), exactMatches[word]);
                });

                // 2. Chhoti I Reordering
                text = text.replace(/((?:[\u0915-\u0939]\u094d)*)([\u0915-\u0939])\u093f/g, "çÆ$1$2");

                // 3. Ligature Handling (v42.0)
                text = text.replace(/श\u094dय/g, "µ³ç"); // Shya -> µ³ç (Fix for Vaishya)
                text = text.replace(/ज्ञ\u093e/g, "%çç"); // Gyaa -> %çç (Fix for Gyaati)
                text = text.replace(/ज्ञ/g, "%"); // Gya -> %

                text = text.replace(/ङ\u094dक/g, "¹"); text = text.replace(/श\u094dव/g, "é");
                text = text.replace(/द\u094dभ/g, "t"); text = text.replace(/क\u094dत\u093f/g, "çqJçwlç");
                text = text.replace(/श\u094dर/g, "Þç"); text = text.replace(/ष\u094dठ/g, "÷");
                text = text.replace(/ष\u094dट/g, "ä"); text = text.replace(/त\u094dर/g, "$ç");
                text = text.replace(/श\u094dच/g, "½ç"); text = text.replace(/क\u094dर/g, "¬çÀ");
                text = text.replace(/द\u094dव/g, "Ü"); text = text.replace(/ब\u094dर/g, "yç´");
                text = text.replace(/र\u0941/g, "©"); text = text.replace(/र\u0942/g, "ª");
                text = text.replace(/ग\u094dग/g, "iiç"); text = text.replace(/ल\u094dल/g, "u}");
                text = text.replace(/ठ\u094dय/g, "\"îç"); text = text.replace(/स\u094dफ/g, "mHç");
                text = text.replace(/स\u094dव/g, "mJç"); text = text.replace(/ङ\u094d/g, "*d");
                text = text.replace(/\u0947\u0902/g, "W"); text = text.replace(/रW/g, "jW");
                text = text.replace(/ह\u0943/g, "Ë"); text = text.replace(/द्ध/g, "×");
                text = text.replace(/च्छ/g, "®sç"); text = text.replace(/न्ध/g, "vOç");
                text = text.replace(/म्य/g, "c³ç"); text = text.replace(/द्य/g, "Ðç");
                text = text.replace(/ब\u094dद/g, "yo"); text = text.replace(/ज\u094dञ/g, "%");
                text = text.replace(/ध\u094dय/g, "O³ç"); text = text.replace(/क्ष/g, "#ç");
                text = text.replace(/क\u094dष/g, "#"); text = text.replace(/ङ\u094dग/g, "biç");
                text = text.replace(/ऱ/g, "]j"); text = text.replace(/ड\u094dर/g, "[^");
                text = text.replace(/ट\u094dर/g, "ì^"); text = text.replace(/भ\u094d/g, "Y");
                text = text.replace(/ख़/g, "™"); text = text.replace(/\u0916\u093c/g, "™");
                text = text.replace(/प\u094dर/g, "Òç"); text = text.replace(/ढ\u093c/g, "{");
                text = text.replace(/ढ़/g, "{");

                text = text.replace(/\u0943/g, "=");
                text = text.replace(/\u094d(?=[\s\.,;:)\]\-]|$)/g, "d");

                text = text.replace(/न\u094d/g, "v"); text = text.replace(/थ\u094d/g, "L");
                text = text.replace(/म\u094d/g, "c"); text = text.replace(/ग\u094d/g, "i");
                text = text.replace(/ल\u094d/g, "u"); text = text.replace(/स\u094d/g, "m");
                text = text.replace(/क\u094d/g, "Jçw"); text = text.replace(/द\u094d/g, "o");
                text = text.replace(/ष\u094d/g, "<"); text = text.replace(/त\u094d/g, "l");
                text = text.replace(/श\u094d/g, "µ"); // Half Sha generic

                text = text.replace(/\u0930\u094d(\u092f)/g, "³ç&");
                text = text.replace(/\u0930\u094d([\u0915-\u0939])([\u093e-\u094c]?)/g, "$1$2&");

                let result = "";
                let i = 0;
                while (i < text.length) {
                    const char = text[i];
                    if (/[A-Za-z0-9çÆçÇçíçÌ|û}ê~\]®HBCª&WQS=ÊÒ$Ðäîõ@V¬#yo×`'öõ%ä"îç{Ë<Ü÷©:*dui´^™½vcLiYmÞ¹étµ]/.test(char) || char === '’' || char === '(' || char === ')' || char === ':' || char === '~' || char === "'" || char === ',' || char === '-') {
                        result += char;
                        i++;
                        continue;
                    }
                    let found = false;
                    const clusters = ['क्ष', 'त्र', 'ज्ञ'];
                    for (const c of clusters) {
                        if (text.startsWith(c, i)) {
                            result += mapping[c];
                            i += c.length;
                            found = true;
                            break;
                        }
                    }
                    if (found) continue;
                    result += mapping[char] || char;
                    i++;
                }
                
                result = result.replace(/JçÀí/g, "JçíÀ");
                result = result.replace(/JçÀÌ/g, "JçÌÀ");
                result = result.replace(/JçÀá/g, "JçáÀ");
                result = result.replace(/JçÀÓ/g, "JçÓÀ");
                result = result.replace(/JçÀç/g, "JçÀç");
                result = result.replace(/JçÀçí/g, "JçÀçí");

                return result;
            };

            const handleConvert = () => {
                setOutputText(convertToMillennium(inputText));
            };

            const handleCopy = () => {
                const el = document.createElement('textarea');
                el.value = outputText;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopied(true);

                        </div>

                        <div className="bg-white rounded-[3rem] p-10 border border-slate-200 shadow-sm mt-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                <div className="space-y-6">
                                    <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest flex items-center gap-2">
                                        <IconAlertCircle /> Accuracy Test Match
                                    </h3>
                                    <div className="space-y-4">
                                        {[
                                            { u: "वैश्य", m: "JçÌµ³ç" },
